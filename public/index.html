<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="晁军个人名片网页 - 电影录音师、声音设计师">
  <title>晁军 | 个人名片</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="no-posters" data-lang="zh">
  <div class="poster-backdrop" aria-hidden="true">
    <div class="poster-layer poster-primary" id="poster-primary"></div>
    <div class="poster-layer poster-left" id="poster-left"></div>
    <div class="poster-layer poster-right" id="poster-right"></div>
    <div class="poster-overlay"></div>
    <div class="grain"></div>
  </div>

  <main class="card">
    <header class="topbar">
      <div class="mark">CHAO JUN</div>
      <div class="lang-switch" role="group" aria-label="Language switch">
        <button type="button" class="lang-btn active" data-set-lang="zh">中文</button>
        <button type="button" class="lang-btn" data-set-lang="en">EN</button>
      </div>
    </header>

    <section class="hero">
      <p class="kicker" id="kicker">影视声音创作档案</p>
      <h1 id="name">晁军</h1>
      <p class="title" id="title">电影录音师、声音设计师</p>
      <p class="intro" id="intro">长期参与电影与影视声音创作，聚焦现场录音、声音设计与后期声音协作。</p>
    </section>

    <section class="panel">
      <h2 id="works-heading">代表作品</h2>
      <div class="credits-window">
        <ul id="works-list" class="works-list">
          <li>《找乐》 (1992)    /    《龙城正月》 (1995)    /    《漂亮妈妈》 (2000)</li>
          <li>《生活秀》 (2002)    /    《秋之白华》 (2011)    /    《大唐玄奘》 (2016)</li>
        </ul>
      </div>
    </section>

    <section class="panel">
      <h2 id="about-heading">关于</h2>
      <p id="about-text">1978年毕业于北京电影学院录音系。</p>
    </section>

    <a class="cert-link" id="cert-link" href="https://www.icmdb.cn" target="_blank" rel="noopener noreferrer">
      CMDb 华语影视从业认证
    </a>
  </main>

  <script src="assets/main.js"></script>
</body>
</html>
